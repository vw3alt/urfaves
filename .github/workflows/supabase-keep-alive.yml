name: Supabase Keep Alive
on:
  schedule:
    # This runs at 00:00 every Monday and Thursday
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database via REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/restaurants?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
